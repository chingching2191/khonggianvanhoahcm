<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Gallery Bác Hồ</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  overflow-x:hidden;
  background:#F9F4E3;
  font-family:Arial,sans-serif;
}

/* SECTION */

#gallery{
  width:100%;
  overflow:hidden;
  padding:60px 0;
  background:#F9F4E3;
}

/* HEADER */

.gallery-header{
  text-align:center;
  margin-bottom:35px;
  padding:0 20px;
}

.section-label{
  font-size:clamp(11px,2vw,14px);
  letter-spacing:5px;
  text-transform:uppercase;
  color:#B8860B;
}

.gold-rule{
  width:90px;
  height:2px;
  margin:16px auto 0;
  background:
    linear-gradient(
      90deg,
      transparent,
      #D4A017,
      transparent
    );
}

/* TRACK */

.gallery-track-wrapper{
  width:100%;
  overflow:hidden;
  position:relative;
}

.gallery-track{
  display:flex;
  gap:min(3vw,20px);
  width:max-content;
  will-change:transform;
}

/* CARD */

.gallery-card{

  width:min(78vw,320px);

  aspect-ratio:16/10;

  position:relative;

  overflow:hidden;

  border-radius:20px;

  flex-shrink:0;

  background:#000;

  box-shadow:
    0 10px 30px rgba(0,0,0,.12);

}

.gallery-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:0.6s;
}

.gallery-card:hover img{
  transform:scale(1.05);
}

/* TEXT */

.gallery-card-label{

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:18px 14px 12px;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.88)
    );

  color:#F7D96B;

  font-size:clamp(12px,2vw,14px);

  line-height:1.5;

}

/* MOBILE EXTRA */

@media(max-width:500px){

  #gallery{
    padding:45px 0;
  }

  .gallery-card-label{
    padding:14px 10px 10px;
  }

}

</style>

</head>

<body>

<section id="gallery">

  <div class="gallery-header">

    <p class="section-label">
      Hình ảnh lịch sử
    </p>

    <div class="gold-rule"></div>

  </div>

  <div class="gallery-track-wrapper">

    <div class="gallery-track" id="galleryTrack">

      <!-- CARD -->

      <div class="gallery-card">
        <img src="https://img.baobacninhtv.vn/Medias/2020/04/13/17/20200413171343-bac-ho.jpg">

        <div class="gallery-card-label">
          Hình ảnh gần gũi của Bác Hồ với các cháu thiếu niên, nhi đồng
        </div>
      </div>

      <div class="gallery-card">
        <img src="https://cdn.nbtv.vn/upload/news/7_2022/b1_16213020072022.jpg">

        <div class="gallery-card-label">
          Chủ tịch Hồ Chí Minh vui múa hát cùng các cháu thiếu nhi
        </div>
      </div>

      <div class="gallery-card">
        <img src="https://khodulieu.sohoa.tuyenquang.gov.vn/congthongtin/media/9597dd3cc5500193f8bb77fa51c0e90e.jpg">

        <div class="gallery-card-label">
          Chủ tịch Hồ Chí Minh chụp ảnh lưu niệm cùng thiếu nhi
        </div>
      </div>

      <div class="gallery-card">
        <img src="https://image.bnews.vn/MediaUpload/Org/2021/05/19/084637-ky-niem-131-nam-ngay-sinh-chu-tich-ho-chi-minh-nguoi-bac-kinh-yeu-vo-cung-gan-gui-luon-dong-cam-va-chan-hoa-voi-cac-chau.jpg">

        <div class="gallery-card-label">
          Chủ tịch Hồ Chí Minh thăm và chia kẹo cho các cháu nhi đồng
        </div>
      </div>

    </div>

  </div>

</section>

<script>

(function(){

  const track =
    document.getElementById('galleryTrack');

  if(!track) return;

  const cards =
    Array.from(track.children);

  /* clone */

  cards.forEach(card=>{

    const clone =
      card.cloneNode(true);

    clone.setAttribute(
      'aria-hidden',
      'true'
    );

    track.appendChild(clone);

  });

  let currentX = 0;
  let lastTime = null;
  let paused = false;

  const SPEED = 55;

  function getSetWidth(){

    let width = 0;

    cards.forEach(card=>{
      width += card.offsetWidth;
    });

    width +=
      (cards.length - 1)
      *
      parseFloat(
        getComputedStyle(track).gap
      );

    return width;

  }

  let setWidth = getSetWidth();

  function animate(timestamp){

    if(lastTime === null){
      lastTime = timestamp;
    }

    const delta =
      timestamp - lastTime;

    lastTime = timestamp;

    if(!paused){

      currentX +=
        SPEED * (delta / 1000);

      if(currentX >= setWidth){
        currentX = 0;
      }

      track.style.transform =
        `translateX(-${currentX}px)`;

    }

    requestAnimationFrame(animate);

  }

  track.addEventListener(
    'mouseenter',
    ()=> paused = true
  );

  track.addEventListener(
    'mouseleave',
    ()=>{
      paused = false;
      lastTime = null;
    }
  );

  track.addEventListener(
    'touchstart',
    ()=> paused = true,
    { passive:true }
  );

  track.addEventListener(
    'touchend',
    ()=>{
      paused = false;
      lastTime = null;
    },
    { passive:true }
  );

  window.addEventListener(
    'resize',
    ()=>{

      setWidth =
        getSetWidth();

      currentX = 0;

    }
  );

  requestAnimationFrame(animate);

})();

</script>

</body>
</html>
